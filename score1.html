<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="score1.css">
    <title>Cricket Scorekeeper</title>
    <script src="https://code.jquery.com/jquery-3.4.0.min.js"></script>
    <script type="text/javascript" src="score1.js"></script>
</head>
<body>
<section>
    <div class="container">
        <div class="setup-section">
            <div class="teams">
                <input type="text" id="team1" name="team1" placeholder="Enter Team-1 Name....">
                <label class="vs-label">Vs</label>
                <input type="text" id="team2" name="team2" placeholder="Enter Team-2 Name....">
            </div>
            <div class="players-section">
                <div class="team-players">
                    <label id="label1">Team-1</label>
                    <div id="team1-players"></div>
                </div>
                <div class="team-players">
                    <label id="label2">Team-2</label>
                    <div id="team2-players"></div>
                </div>
            </div>
            <div class="match-setup">
                <input type="text" id="overs" name="overs" placeholder="Number Of Overs...">
                <div class="toss-section">
                    <input type="text" id="toss1" name="team1toss" placeholder="Team-1 Toss Choice">
                    <label class="vs-label">Vs</label>
                    <input type="text" id="toss2" name="team2toss" placeholder="Team-2 Toss Choice">
                </div>
                <input type="text" id="choice" placeholder="Toss Winner's Choice (bat/bowl)">
                <input type="text" id="first-bowler" placeholder="First Bowler's Name">
                <button type="button" class="btn" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div class="game-section" style="display:none;">
            <div class="score-board">
                <div class="tabs">
                    <button class="tab-link active" onclick="openTab(event, 'admin')">Admin</button>
                    <button class="tab-link" onclick="openTab(event, 'scoreboard')">Score Board</button>
                </div>
                <div id="admin" class="tab-content" style="display:block;">
                    <div class="input-field">
                        <input type="text" placeholder="Enter Score Here......" class="input" id="input1" name="input">
                        <button type="button" class="btn" onclick="play()">Submit</button>
                    </div>
                </div>
                <div id="scoreboard" class="tab-content">
                    <label class="main" id="main"></label>
                    <label class="overs" id="overs1"></label>
                    <label class="batsman" id="bat1"></label>
                    <label class="batsman" id="bat2"></label>
                    <label class="bowler" id="bowler"></label>
                </div>
            </div>
        </div>

        <div class="modal" id="over-modal">
            <div class="modal-content">
                <h2>Over Up!</h2>
                <input type="text" id="bowlername" placeholder="Who Is Going To Ball Next........!">
                <button type="button" class="btn" onclick="overUp()">Submit</button>
            </div>
        </div>

        <div class="modal" id="innings-modal">
            <div class="modal-content">
                <h2>Innings Break</h2>
                <button class="btn" type="button" onclick="resetValues()">Begin 2nd Innings</button>
            </div>
        </div>

        <div class="modal" id="runout-modal">
            <div class="modal-content">
                <h2>Run Out</h2>
                <input type="text" id="runout" placeholder="Who Failed To Reach The Crease?">
                <button class="btn" type="button" onclick="runOut()">Submit</button>
            </div>
        </div>
    </div>
</section>
</body>
</html>
